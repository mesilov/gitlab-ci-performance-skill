$('footer').textContent=L('Self-contained offline report · ','Автономный отчёт · ')+(R.coverage.source.complete_available_history?L('Available API history collected completely','Доступная история API получена полностью'):L('Partial source history','Частичная история источника'));
for(const[text,color]of [[labels.queue,'var(--queue)'],[labels.success,'var(--success)'],[labels.failed,'var(--failed)'],[labels.canceled,'var(--canceled)'],[L('Other outcomes','Прочие результаты'),'var(--other)'],[L('Not run','Не выполнялось'),null],[L('Successful median','Медиана успешных'),'median']]){const span=el('span'),i=el('i',null,'swatch');if(color==='median')i.classList.add('median');else if(color)i.style.background=color;else i.classList.add('hollow');span.append(i,document.createTextNode(text));$('legend').append(span);}
