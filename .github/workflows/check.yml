name: Check skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: The examples are up to date
        run: |
          python examples/make_demo.py
          git diff --exit-code examples
      - name: A copied skill works alone
        run: |
          cp -R skills/gitlab-ci-performance "$RUNNER_TEMP/skill"
          python "$RUNNER_TEMP/skill/scripts/ci_report.py" --from examples/data.json --out "$RUNNER_TEMP/report" --lang ru
