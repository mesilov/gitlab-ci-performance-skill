name: Check skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --only-binary=:all: -r skills/gitlab-ci-performance/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/gitlab-ci-performance/scripts/ci_report.py validate examples/jobs.json
      - run: python skills/gitlab-ci-performance/scripts/ci_report.py validate examples/report.json
      - run: |
          python skills/gitlab-ci-performance/scripts/ci_report.py report --snapshot examples/jobs.json --catalog examples/catalog.json --output reports/smoke/report.json
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/smoke/report.json --output reports/smoke/report.html
