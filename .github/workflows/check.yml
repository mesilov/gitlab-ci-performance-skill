name: Check skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --only-binary=:all: -r skills/gitlab-ci-performance/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/gitlab-ci-performance/scripts/ci_report.py validate examples/jobs.json
      - run: python skills/gitlab-ci-performance/scripts/ci_report.py validate examples/report.json
      - run: |
          python skills/gitlab-ci-performance/scripts/ci_report.py report --snapshot examples/jobs.json --catalog examples/catalog.json --output reports/smoke/report.json
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/smoke/report.json --output reports/smoke/report.html
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/smoke/report.json --language ru --output reports/smoke/report-ru.html
      - run: |
          python examples/generate_release_demo.py --output-dir reports/release-smoke
          python skills/gitlab-ci-performance/scripts/ci_report.py validate reports/release-smoke/report.json
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/release-smoke/report.json --language ru --output reports/release-smoke/report-ru.html
      - run: |
          python examples/generate_workflow_demo.py --output-dir reports/workflows
          tar --exclude='__pycache__' --exclude='*.pyc' -czf reports/gitlab-ci-performance-2.0.0.tar.gz -C skills gitlab-ci-performance
          mkdir -p "$RUNNER_TEMP/workflow-install"
          tar -xzf reports/gitlab-ci-performance-2.0.0.tar.gz -C "$RUNNER_TEMP/workflow-install"
          python "$RUNNER_TEMP/workflow-install/gitlab-ci-performance/scripts/ci_report.py" report --snapshot reports/workflows/jobs.json --workflows reports/workflows/workflows.json --output reports/installed/report.json
          python "$RUNNER_TEMP/workflow-install/gitlab-ci-performance/scripts/ci_report.py" render --report reports/installed/report.json --output reports/installed/report.html
          python "$RUNNER_TEMP/workflow-install/gitlab-ci-performance/scripts/ci_report.py" export-llm --report reports/installed/report.json --output reports/installed/llm.json
          python "$RUNNER_TEMP/workflow-install/gitlab-ci-performance/scripts/ci_report.py" validate reports/installed/llm.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r skills/gitlab-ci-performance/requirements.txt
      - run: npm install --prefix "$RUNNER_TEMP/workflow-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: node "$RUNNER_TEMP/workflow-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          python examples/generate_demo.py --output-dir reports/jobs
          python examples/generate_workflow_demo.py --output-dir reports/workflows
          python examples/generate_release_demo.py --output-dir reports/releases
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/jobs/report.json --language ru --output reports/jobs/report-ru.html
          python skills/gitlab-ci-performance/scripts/ci_report.py render --report reports/releases/report.json --language ru --output reports/releases/report-ru.html
          export CI_REPORT_PLAYWRIGHT="$RUNNER_TEMP/workflow-browser/node_modules/playwright"
          export CI_REPORT_BROWSER_CHANNEL=chromium
          node tests/browser_check.cjs "file://$GITHUB_WORKSPACE/reports/jobs/report.html" reports/jobs/qa
          node tests/browser_check.cjs "file://$GITHUB_WORKSPACE/reports/jobs/report-ru.html" reports/jobs/qa-ru ru
          node tests/browser_release_check.cjs "file://$GITHUB_WORKSPACE/reports/releases/report.html" reports/releases/qa
          node tests/browser_release_check.cjs "file://$GITHUB_WORKSPACE/reports/releases/report-ru.html" reports/releases/qa-ru ru
          node tests/workflow_browser_check.cjs "file://$GITHUB_WORKSPACE/reports/workflows/report.html" reports/workflows/qa
