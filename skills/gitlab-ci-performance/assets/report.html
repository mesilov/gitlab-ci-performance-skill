function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=String(text);if(cls)e.className=cls;return e;}
function safeLink(a,value){try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error();a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return true;}catch{a.removeAttribute('href');return false;}}
function link(text,url){const a=el('a',text);safeLink(a,url);return a;}
function format(value,unit=currentWindow()?.unit||'seconds'){if(value==null||!Number.isFinite(value))return '—';return (unit==='minutes'?value/60:value).toLocaleString(locale,{maximumFractionDigits:2})+' '+t(unit);}
function signed(value,unit){return value==null?'—':(value>0?'+':value<0?'−':'')+format(Math.abs(value),unit);}
function date(value,full=false){if(!value)return '—';try{return new Intl.DateTimeFormat(locale,{timeZone:R.timezone||'UTC',day:'2-digit',month:'short',...(full?{year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}:{})}).format(new Date(value));}catch{return '—';}}
function currentWindow(){return selectedType?.windows.find(w=>w.size===windowSize&&w.offset===windowOffset);}
function status(code){return t(code==='created'?'createdStatus':code==='not_run'?'not_run_status':code);}
function purpose(type){return typeof type.purpose==='string'?type.purpose:type.purpose?.description||t('unknownPurpose');}
function outcomeColor(code){return code==='success'?'var(--success)':code==='failed'?'var(--failed)':code==='canceled'?'var(--canceled)':'var(--other)';}
function metricText(metric){return format(metric?.p50_seconds)+' · '+t('known')+' '+(metric?.known||0)+' / '+t('missing')+' '+(metric?.missing||0);}
function execution(job){return job?.execution_seconds??(job?.executed===false?null:job?.duration_seconds??null);}
function total(job){return job?.total_seconds??(job?.executed===false?null:execution(job)!=null&&job.queued_seconds!=null?execution(job)+job.queued_seconds:null);}
function scopeText(w){return t('displayed')+' '+w.count+' · '+date(w.from)+' — '+date(w.to)+' · '+t('successful')+' '+w.successful_n;}
function drawCards(){const holder=$('job-cards');holder.replaceChildren();for(const type of R.types||[]){const b=el('button',null,'job-card');b.type='button';b.dataset.typeId=type.id;b.setAttribute('aria-pressed',String(type.id===selectedType?.id));if(type.id===R.attention_type_id)b.append(el('span',t('attention'),'attention'));const name=el('strong',type.name);name.dataset.typeName='';b.append(name,el('p',purpose(type)));const c=type.comparison||{},ownUnit=(c.latest_seconds||0)>300?'minutes':'seconds';b.append(el('div',format(c.latest_seconds,ownUnit),'card-number'),el('div',t('latestTotal'),'card-note'));b.append(el('div',c.baseline_seconds==null?t('noBaseline'):t('baseline')+' '+format(c.baseline_seconds,ownUnit)+' · '+signed(c.delta_seconds,ownUnit)+' · N '+c.known,'card-note'));b.append(el('div',Object.entries(type.status_counts||{}).filter(([,n])=>n).map(([s,n])=>status(s)+' '+n).join(' · '),'status-counts'));b.append(el('div',t('retained')+' '+type.retained_ids.length+' / '+t('sourceScope')+' '+type.source_count,'card-note'));b.addEventListener('click',()=>selectType(type.id));holder.append(b);}}

function drawSelected(){const w=currentWindow()||selectedType.windows.find(v=>v.size===windowSize);if(!w)return;windowOffset=w.offset;$('job-detail').dataset.typeId=selectedType.id;$('job-title').textContent=selectedType.name;$('job-stage').textContent=t('stage')+': '+selectedType.stage;$('job-description').textContent=purpose(selectedType);const pp=$('purpose-provenance');pp.replaceChildren();if(typeof selectedType.purpose==='object'){const p=selectedType.purpose;if(p.source_url)pp.append(link(t('config'),p.source_url));if(p.verified_at)pp.append(document.createTextNode(' · '+t('verified')+' '+date(p.verified_at,true)));if(p.source_ref||p.ref)pp.append(document.createTextNode(' · '+(p.source_ref||p.ref)));if(p.configuration_sha256||p.source_sha256||p.sha256)pp.append(el('div',p.configuration_sha256||p.source_sha256||p.sha256,'hash'));} $('window-period').textContent=scopeText(w);$('older-window').disabled=windowSize===64||!selectedType.windows.some(v=>v.size===32&&v.offset===32&&v.count);$('newer-window').disabled=windowOffset===0;$('latest-window').disabled=windowOffset===0;drawPriorities(w);drawHistory(w);drawAttempts(w);drawSameRef();if(!w.attempt_ids.some(id=>String(id)===String(selectedJob)))selectedJob=w.attempt_ids[0]??null;drawAttempt();updateSelections();}
