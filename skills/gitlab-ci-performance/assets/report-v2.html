<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:1200px;margin:auto;padding:32px 24px 60px}h1{font-size:clamp(22px,3vw,32px);letter-spacing:-.025em;margin:8px 0 14px}h2{font-size:21px;margin:0 0 16px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.55;text-wrap:pretty}a{color:var(--blue)}button,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:20px;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.card{text-align:left;padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}.card[aria-pressed=true]{background:var(--selected);border-color:var(--blue)}.card strong,.card span{overflow-wrap:anywhere}.attention{color:var(--attention)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar label{display:flex;gap:8px;align-items:center}.toolbar select{max-width:100%}.metrics{display:flex;gap:28px;flex-wrap:wrap}.metrics span{display:block}.metrics strong{font-size:24px;font-variant-numeric:tabular-nums}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:16px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}.chart svg{display:block;width:100%;height:auto;min-width:0}.chart g[role=button]{cursor:pointer}.chart g[aria-pressed=true] .outline{stroke:var(--blue);stroke-width:2}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:500;color:var(--muted)}td{font-variant-numeric:tabular-nums}tr[aria-selected=true]{background:var(--selected)}.number{white-space:nowrap}.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}.finding{border:1px solid var(--line);border-radius:7px;padding:16px}.finding strong{display:block;font-size:22px;margin:9px 0}.finding p{font-size:13px;overflow-wrap:anywhere}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}.detail-grid p{margin:6px 0;font-size:13px;overflow-wrap:anywhere}.evidence button{text-align:left;max-width:100%;overflow-wrap:anywhere}.evidence .nested{padding-left:28px}code{font-size:11px;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);margin-top:24px;overflow-wrap:anywhere}.error{color:var(--red)}[hidden]{display:none!important}@media(max-width:500px){main{padding:20px 12px}.panel{padding:14px}.toolbar label{width:100%;justify-content:space-between}.metrics{gap:18px}}
</style></head><body><main>
<div class="eyebrow">GitLab · Job performance</div><h1>__REPORT_TITLE__</h1><a id="project"></a><p id="freshness" class="muted"></p>
<section class="panel"><h2 id="priority-heading"></h2><p id="scope" class="muted"></p><div id="metrics" class="metrics"></div><p id="spike"></p><div id="findings" class="findings"></div></section>

</main><script id="report-data" type="application/json">__REPORT_DATA__</script><script>
'use strict';
const R=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),ru=R.language==='ru',L=(en,r)=>ru?r:en;

 for(const code of f.priority_codes){const c=f.categories.find(c=>c.code===code),box=el('article',null,'finding');box.dataset.category=code;box.dataset.seconds=c.median_seconds;box.append(el('h3',c.rank+'. '+labels[code]),el('strong',fmt(c.median_seconds,u)),el('p','N '+c.known+' · '+L('missing ','нет данных ')+c.missing),el('p',c.finding.proposed_action),el('p',c.finding.uncertainty,'muted'));for(const g of c.finding.guidance)box.append(link(g.page_title+' · '+g.status,g.url));if(c.representative){const b=el('button',L('Inspect run','Посмотреть запуск')+' #'+c.representative.attempt_id);b.addEventListener('click',()=>openAttempt(c.representative.attempt_id,c.representative.evidence_id));box.append(b);}$('findings').append(box);}

}
function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!=null)e.textContent=text;return e;}
function drawChart(w){const attempts=w.attempt_ids.map(id=>R.attempts.find(a=>a.id===id)).reverse();if(!attempts.length)return;const max=Math.max(1,...attempts.map(a=>(a.timing.queue.value_seconds??0)+(a.timing.execution.value_seconds??0))),left=70,bottom=170,height=145,step=910/attempts.length,plot=svg('svg',{viewBox:'0 0 1000 215',role:'img','aria-label':L('Runner wait above execution, per attempt','Ожидание раннера над выполнением, по попыткам')});
 for(const ratio of [0,.5,1]){const y=bottom-ratio*height;plot.append(svg('line',{x1:left,x2:988,y1:y,y2:y,stroke:'var(--line)'}),svg('text',{x:left-8,y:y+4,'text-anchor':'end',fill:'var(--muted)','font-size':11},fmt(max*ratio,w.display_unit)));}
 const median=w.descriptive.metrics.total.median_seconds;if(median!=null)plot.append(svg('line',{x1:left,x2:988,y1:bottom-median/max*height,y2:bottom-median/max*height,stroke:'var(--blue)','stroke-dasharray':'5 5','data-median-seconds':median}));
 attempts.forEach((a,i)=>{const x=left+(i+.5)*step,bw=Math.min(34,step*.72),q=a.timing.queue.value_seconds,r=a.timing.execution.value_seconds,qh=(q??0)/max*height,rh=(r??0)/max*height,g=svg('g',{role:'button',tabindex:0,'aria-label':'#'+a.id+' '+a.metadata.status,'aria-pressed':String(a.id===attemptId),'data-attempt':a.id});g.append(svg('title',{},'#'+a.id+' · '+a.metadata.ref+' · '+a.metadata.status+' · '+labels.queue+' '+fmt(q,w.display_unit)+' · '+L('Execution ','Выполнение ')+fmt(r,w.display_unit)));if(r!=null)g.append(svg('rect',{x:x-bw/2,y:bottom-rh,width:bw,height:rh,fill:a.metadata.status==='success'?'var(--green)':a.metadata.status==='failed'?'var(--red)':'var(--gray)','data-execution-seconds':r}));else g.append(svg('circle',{cx:x,cy:bottom-4,r:3,fill:'none',stroke:'var(--gray)'}));if(q!=null)g.append(svg('rect',{x:x-bw/2,y:bottom-rh-qh,width:bw,height:qh,fill:'var(--gray)','data-queue-seconds':q}));g.append(svg('rect',{class:'outline',x:x-bw/2-2,y:bottom-rh-qh-2,width:bw+4,height:Math.max(8,rh+qh)+4,fill:'none',stroke:'none'}));if(i%Math.max(1,Math.ceil(attempts.length/10))===0)g.append(svg('text',{x,y:191,'text-anchor':'middle',fill:'var(--muted)','font-size':10},'#'+a.id));g.addEventListener('click',()=>openAttempt(a.id));g.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();openAttempt(a.id);}});plot.append(g);});$('chart').append(plot);
}
function drawHistory(w){for(const id of w.attempt_ids){const a=R.attempts.find(a=>a.id===id),j=a.metadata,tr=el('tr');tr.dataset.attempt=id;tr.setAttribute('aria-selected',String(id===attemptId));const cell=el('td'),button=el('button','#'+id);button.addEventListener('click',()=>openAttempt(id));cell.append(button);tr.append(cell,el('td',j.ref),el('td',j.status+' / '+a.pipeline.status),el('td',date(j.created_at)));for(const key of ['queue','execution','total']){const td=el('td',fmt(a.timing[key].value_seconds,w.display_unit),'number');td.dataset.timing=key;td.dataset.seconds=a.timing[key].value_seconds;tr.append(td);}$('history').append(tr);}}
function openAttempt(id,evidenceId=null){const a=R.attempts.find(a=>a.id===id);if(!a)return;attemptId=id;$('detail').hidden=false;$('detail-title').textContent='#'+id+' · '+a.metadata.name;$('attempt-detail').replaceChildren();const first=el('div');first.append(link(L('Original GitLab job','Исходная job в GitLab'),a.metadata.web_url),el('p','Ref: '+a.metadata.ref),el('p','Job / pipeline: '+id+' / '+a.pipeline.id),el('p',L('Job / pipeline status: ','Статус job / pipeline: ')+a.metadata.status+' / '+a.pipeline.status),el('p','Commit: '+(a.metadata.sha||'—')),el('p',L('Runner: ','Раннер: ')+(a.metadata.runner?.description||'—')),el('p',date(a.metadata.created_at)));const second=el('div');for(const key of ['queue','execution','total','lifecycle','prestart'])second.append(el('p',key+': '+fmt(a.timing[key].value_seconds,selectedWindow()?.display_unit)+' · '+a.timing[key].origin));$('attempt-detail').append(first,second);const t=a.trace;$('trace-state').textContent=t?t.state+' · '+t.reason_code+' · '+t.coverage.recognized_lines+'/'+t.line_count+' '+L('recognized lines','распознано строк'):L('No trace was collected for baseline-only metadata.','Trace для метаданных baseline не собирался.');$('evidence').replaceChildren();$('evidence-selection').textContent='';for(const n of t?.evidence||[]){const tr=el('tr'),cell=el('td'),b=el('button',n.kind+' · '+n.code);cell.className=n.parent_id?'nested':'';b.addEventListener('click',()=>selectEvidence(n));cell.append(b);tr.dataset.evidence=n.id;tr.append(cell,el('td',fmt(n.timing.duration_seconds,selectedWindow()?.display_unit),'number'),el('td',n.timing.origin+' · '+n.timing.quality+(n.cached?' · cached':'')),el('td',n.lines.start+'–'+n.lines.end));$('evidence').append(tr);if(n.id===evidenceId)selectEvidence(n);}document.querySelectorAll('[data-attempt]').forEach(e=>{if(e.tagName==='g')e.setAttribute('aria-pressed',String(Number(e.dataset.attempt)===id));else e.setAttribute('aria-selected',String(Number(e.dataset.attempt)===id));});}
function selectEvidence(n){document.querySelectorAll('[data-evidence]').forEach(e=>e.setAttribute('aria-selected',String(e.dataset.evidence===n.id)));$('evidence-selection').textContent=n.id+' · '+L('source lines ','строки источника ')+n.lines.start+'–'+n.lines.end+' · '+L('Push coverage: ','Покрытие push: ')+n.push_coverage;}
function headings(id,items){const tr=el('tr');for(const item of items)tr.append(el('th',item));$(id).append(tr);}
$('project').replaceWith(Object.assign(link(R.project.path,R.project.web_url),{id:'project'}));$('freshness').textContent=L('Original collection: ','Исходный сбор: ')+date(R.collected_at)+' · '+L('Report generated: ','Отчёт сформирован: ')+date(R.generated_at)+' · '+R.timezone;
$('priority-heading').textContent=L('What to improve first','Что улучшить в первую очередь');$('jobs-heading').textContent=L('Analyzed jobs','Анализируемые jobs');$('window-label').textContent=L('Attempts','Попытки');$('older').textContent=L('Older','Старее');$('newer').textContent=L('Newer','Новее');$('latest').textContent=L('Latest','Последние');$('evidence-heading').textContent=L('Timing evidence','Данные о времени');$('method-heading').textContent=L('Method and provenance','Методика и источники');$('method').textContent=L('Stored timings are seconds. Baselines require successful jobs and successful pipelines; window statistics describe successful jobs. Category costs use per-run interval unions followed by the median, exclude unknown/cached durations, and are not additive or guaranteed savings.','В JSON время хранится в секундах. Baseline требует успешной job и pipeline; статистика окна описывает успешные jobs. Стоимость категории — медиана объединений интервалов по запуску. Неизвестные и кешированные длительности исключены. Категории нельзя складывать или считать гарантированной экономией.');$('provenance').textContent=R.report_id+' · '+R.provenance.snapshot_sha256+' · schema '+R.schema_version+' / calculation '+R.calculation_version+' / parser '+R.trace_parser_version;$('footer').textContent=L('Self-contained offline report · Source coverage: ','Автономный отчёт · Покрытие источника: ')+R.coverage.source.stop_reason;
for(const[text,color]of [[labels.queue,'var(--gray)'],[L('Success execution','Успешное выполнение'),'var(--green)'],[L('Failed execution','Неуспешное выполнение'),'var(--red)'],[L('Canceled execution','Отменённое выполнение'),'var(--gray)']]){const span=el('span'),i=el('i');i.style.background=color;span.append(i,document.createTextNode(text));$('legend').append(span);}headings('history-head',[L('Attempt','Попытка'),'Ref',L('Job / pipeline status','Статус job / pipeline'),L('Created','Создана'),labels.queue,L('Execution','Выполнение'),L('Complete total','Полное время')]);headings('evidence-head',[L('Evidence','Данные'),L('Duration','Длительность'),L('Origin / quality','Источник / качество'),L('Source lines','Строки источника')]);
